openapi: 3.0.2
info:
  title: Metadata Schema
  version: 1.0.0
paths: {}
components:
  schemas:
    MetaData:
      type: object
      properties:
        descriptor:
          type: string
          example: GetYourGuide AG
        date:
          $ref: "../commons/fields.yaml#/components/schemas/Datetime"
        status:
          type: string
          description: Status of the request
          example: "OK"
        query:
          type: string
          description: URL parameters used for the request sent
          example: "cnt_language=en&currency=eur"
        availableLanguages:
          type: array
          description: Available conduction languages aggregated across all tours
          items:
            $ref: "../commons/fields.yaml#/components/schemas/Language"
          example: [en, es, fr]
        exchange:
          type: object
          description: Deprecated! Please do not use to calculate prices, but pass a different currency parameter in the request URL.
          properties:
            rate:
              type: integer
              example: 1
            currency:
              $ref: "../commons/fields.yaml#/components/schemas/Currency"
        totalCount:
          type: integer
          description: Total amount of tours that match the search query
          example: 127
        limit:
          $ref: "../commons/fields.yaml#/components/schemas/Limit"
        offset:
          $ref: "../commons/fields.yaml#/components/schemas/Offset"
    CursorPageMetadata:
      type: object
      description: Pagination metadata for cursor-based feed endpoints.
      required:
        - start_cursor
        - end_cursor
        - page_size
        - has_next_page
      properties:
        start_cursor:
          description: >
            Cursor of the first element in this page, or the request cursor when the page is
            empty.
          type: string
          example: djE6MjAyNi0wOS0wMVQxMjozNDo1Ni4xMjM0NTYsMQ
        end_cursor:
          description: >
            Cursor of the last element in this page, or the request cursor when the page is empty.
            Pass it as `cursor` on the next request.
          type: string
          example: djE6MjAyNi0wOS0wMVQxMzowMDowMC4wMDAwMDEsMg
        page_size:
          description: Number of elements in this response.
          type: integer
          example: 2
        has_next_page:
          description: Whether more elements are available after `end_cursor`.
          type: boolean
          example: true
