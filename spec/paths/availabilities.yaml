openapi: 3.0.2
info:
  title: Availabilities
  version: 1.0.0
  description: Poll sold-out / back-in-stock availability changes with a cursor.
paths:
  /{version}/availabilities/status/changes:
    get:
      operationId: AvailabilityStatusChanges
      tags:
        - Availabilities
      description: >
        Returns availability slots whose bookability changed (sold out or came back in stock)
        since the given cursor, ordered by cursor ascending. Poll until an empty page is returned,
        then resume from `last_cursor` on the next poll. The feed only contains slots that
        transitioned since the daily availability snapshot; absence of a slot means it is
        unchanged since the snapshot. Slots whose start time has passed are removed from the feed
        and never returned.
      parameters:
        - $ref: "../components/commons/path.yaml#/components/parameters/version"
        - $ref: "#/components/parameters/availabilityChangesCursor"
        - $ref: "#/components/parameters/availabilityChangesLimit"
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  _metadata:
                    $ref: "../components/schema/metadata.yaml#/components/schemas/MetaData"
                  data:
                    type: object
                    properties:
                      deltas:
                        type: array
                        description: Availability deltas ordered by cursor ascending.
                        items:
                          $ref: "#/components/schemas/AvailabilityDelta"
                      first_cursor:
                        type: integer
                        format: int64
                        description: Cursor of the first delta in this page. Absent when `deltas` is empty.
                        example: 1001
                      last_cursor:
                        type: integer
                        format: int64
                        description: >
                          Cursor of the last delta in this page. Pass it as `cursor` on the next
                          request. Absent when `deltas` is empty.
                        example: 1042
                      page_size:
                        type: integer
                        description: Number of deltas in this response.
                        example: 2
        4XX:
          $ref: "../components/schema/errors.yaml#/components/responses/ErrorResponse"
        default:
          $ref: "../components/schema/errors.yaml#/components/responses/Default"
components:
  parameters:
    availabilityChangesCursor:
      description: >
        Cursor returned as `last_cursor` by a previous call; only deltas after it are returned.
        Omit it to start from the beginning of the feed.
      in: query
      name: cursor
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 1042
    availabilityChangesLimit:
      description: Maximum number of deltas to return per page.
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
        example: 1000
  schemas:
    AvailabilityDelta:
      type: object
      required:
        - cursor
        - tour_id
        - option_id
        - date_time
        - update_timestamp
      properties:
        cursor:
          description: Position of this delta in the feed.
          type: integer
          format: int64
          example: 1042
        tour_id:
          $ref: "../components/commons/fields.yaml#/components/schemas/TourId"
        option_id:
          $ref: "../components/commons/fields.yaml#/components/schemas/OptionId"
        date_time:
          description: The start of the availability slot, in UTC.
          type: string
          format: datetime
          example: "2026-09-15T14:30:00"
        vacancies:
          description: >
            Remaining vacancies of the slot. `0` means sold out. Absent when the slot is in stock
            but the exact count is unknown.
          type: integer
          nullable: true
          minimum: 0
          example: 0
        update_timestamp:
          description: >
            When the slot was last updated at the source, in UTC with microsecond precision.
            Apply changes last-write-wins by comparing this against your stored state.
          type: string
          example: "2026-09-01T12:34:56.123456Z"
