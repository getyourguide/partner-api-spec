openapi: 3.0.2
info:
  title: Availabilities
  version: 1.0.0
  description: Poll sold-out / back-in-stock availability changes with a cursor.
paths:
  /{version}/availabilities/status/changes:
    get:
      operationId: AvailabilityStatusChanges
      tags:
        - Availabilities
      description: >
        Tracks sold-out and back-in-stock changes for individual option time slots, not whole
        tours. A change from 4 to 0 vacancies or from 0 to 4 produces a delta; a change from 6
        to 4 does not. Recreating a slot can also update a record the feed already tracks.

        The feed keeps one record per tracked slot. It is not a complete list of available slots
        or a history of every change. Older records can stay in the feed until the slot starts.

        Page with `end_cursor` while `has_next_page` is true, then save the last `end_cursor`
        and use it to resume polling.

        If you also receive a daily availability snapshot (a separate file listing bookable
        slots and their vacancy counts), use it as your baseline. A new snapshot does not clear
        this feed or reset your cursor. When both sources contain the same slot (`tour_id`,
        `option_id`, `date_time`), keep the record with the newer `update_time`. For example,
        if the snapshot shows 4 vacancies and has a newer `update_time` than a delta showing 6,
        keep 4. There is no file-wide cutoff timestamp; use the slot's `update_time`, not the
        file date or upload time.

        This endpoint is limited to master-bill partners. A token without the master-bill
        privilege gets `403`.
      parameters:
        - $ref: "../components/commons/path.yaml#/components/parameters/version"
        - $ref: "#/components/parameters/availabilityChangesCursor"
        - $ref: "#/components/parameters/availabilityChangesLimit"
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  _metadata:
                    $ref: "../components/schema/metadata.yaml#/components/schemas/CursorPageMetadata"
                  data:
                    type: object
                    properties:
                      deltas:
                        type: array
                        description: Availability deltas ordered by feed position ascending.
                        items:
                          $ref: "#/components/schemas/AvailabilityDelta"
        4XX:
          $ref: "../components/schema/errors.yaml#/components/responses/4XX"
        default:
          $ref: "../components/schema/errors.yaml#/components/responses/Default"
components:
  parameters:
    availabilityChangesCursor:
      description: >
        Opaque cursor returned by a previous call; only deltas after it are returned. Omit it to
        start from the beginning of the feed.
      in: query
      name: cursor
      required: false
      schema:
        type: string
        example: djE6MjAyNi0wOS0wMVQxMzowMDowMC4wMDAwMDEsMg
    availabilityChangesLimit:
      description: Maximum number of deltas to return per page.
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
        example: 1000
  schemas:
    AvailabilityDelta:
      type: object
      required:
        - cursor
        - tour_id
        - option_id
        - date_time
        - vacancies
        - update_time
      properties:
        cursor:
          description: Opaque position of this delta in the feed.
          type: string
          example: djE6MjAyNi0wOS0wMVQxMzowMDowMC4wMDAwMDEsMg
        tour_id:
          $ref: "../components/commons/fields.yaml#/components/schemas/TourId"
        option_id:
          $ref: "../components/commons/fields.yaml#/components/schemas/OptionId"
        date_time:
          description: The start of the availability slot, in UTC.
          type: string
          format: datetime
          example: "2026-09-15T14:30:00"
        vacancies:
          description: >
            Remaining vacancies recorded by this delta, not a live count. `0` means sold out.
            `null` means the slot is in stock but the exact count is unknown.
          type: integer
          nullable: true
          minimum: 0
          example: 0
        update_time:
          description: >
            Source timestamp of the update recorded by this delta, in UTC with microsecond
            precision. Use this value to compare records for the same slot.
          type: string
          example: "2026-09-01T12:34:56.123456Z"
